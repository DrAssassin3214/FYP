name: Build Windows exe

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt pyinstaller

      - name: Run tests
        run: python -m pytest -q

      - name: Build exe
        run: pyinstaller fyp_gui.spec --noconfirm --clean

      - name: Smoke test the built exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\FYP-Risk-Tool\FYP-Risk-Tool.exe" -ArgumentList "--no-browser","--port","8765" -PassThru
          $health = $null
          for ($i = 0; $i -lt 30 -and -not $health; $i++) {
            Start-Sleep -Seconds 1
            try { $health = Invoke-RestMethod http://127.0.0.1:8765/api/health } catch {}
          }
          if (-not $health) { Stop-Process -Id $p.Id -Force; throw "exe did not start" }
          Write-Host "health:" ($health | ConvertTo-Json -Compress)
          if ($health.evidence_records -lt 1) { Stop-Process -Id $p.Id -Force; throw "no evidence records loaded" }
          $example = (Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8765/api/example).Content
          $run = Invoke-RestMethod -Method Post -Uri http://127.0.0.1:8765/api/run -ContentType "application/json" -Body $example
          if (-not $run.ok) { Stop-Process -Id $p.Id -Force; throw "example case did not run" }
          Stop-Process -Id $p.Id -Force

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist\FYP-Risk-Tool -DestinationPath FYP-Risk-Tool-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: FYP-Risk-Tool-windows
          path: FYP-Risk-Tool-windows.zip
